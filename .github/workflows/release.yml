name: Release

# A pull request builds and tests the release under a version that is never
# published: the package's own checks, the examples against the working tree,
# then the exact bundle, examples archive, API docs archive, SBOM sidecars and
# manual, and the archived examples against that bundle. Dispatch from main
# with a version to publish the same files. The shared workflow owns the jobs;
# this repository owns its package, examples, notes and Kai tasks.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, such as 0.11.0, or 0.11.0-rc1 for a release candidate; empty runs the dry run"
        type: string
        default: ""
      nightly-tag:
        description: "Exact Roc nightly for a diagnostic run; empty resolves the latest"
        type: string
        default: ""

permissions: {}

jobs:
  Release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    # TODO(thebrandonlucas/roc-automation): the fork's release-package.yml with
    # a Kai path beside the Blueprint one: Kai's setup-kai action, `kai run`
    # for every task, fetch-dependency-sboms reading `kai sbom pins`,
    # sbom-sidecars running `kai sbom inspect`, `bind` and `check`, and a
    # kai-tool action for docs-path. Pinned to the head of the fork's kai branch.
    uses: thebrandonlucas/roc-automation/.github/workflows/release-package.yml@fc8199ada458fca181b7d197bc9eb7b58a2822ff
    with:
      version: ${{ inputs.version || '' }}
      nightly-tag: ${{ inputs.nightly-tag || '' }}
      check-task: check
      # The bundle's SBOM binds the suppliers' documents recorded in
      # sbom/imports.json; a changed record is refused, never adopted.
      sbom-author: "Person: Luke Boswell"
      sbom-task: prepare-sbom
      sbom-imports: sbom/imports.json
      manual: true
      docs-task: install-snippet

  validate-sbom:
    name: Validate source SBOMs
    # Independent schema and supplier regression checks gate pull requests.
    # The shared workflow binds and validates sidecars before publication.
    if: github.event_name == 'pull_request'
    needs: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-kai

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate
          path: dist

      - name: Cache the independent SBOM schema validator downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pip
          key: sbom-validator-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sbom/validator-requirements.txt') }}

      - name: Independently validate the SPDX standard schema
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/sbom-validator"
          "$RUNNER_TEMP/sbom-validator/bin/pip" install --require-hashes -r sbom/validator-requirements.txt
          printf '%s  %s\n' 4126dc29f15e92feec92e9622f4939131ad58b125d6f578aa93e980a6e6f3212 sbom/schema/spdx-2.3.schema.json | sha256sum -c -
          "$RUNNER_TEMP/sbom-validator/bin/check-jsonschema" --schemafile sbom/schema/weaver-source.schema.json dist/*.spdx-2.3.json

      - name: Source SBOMs enter source and native inventories
        run: python3 tests/supply-chain/source-import/check.py
