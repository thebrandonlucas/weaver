name: Set up Kai without Nix
description: Use the shared installer, which installs the Kai release Kaifile.roc names and caches its verified downloads, for this pure Roc package.

runs:
  using: composite
  steps:
    - name: Install the Kai release Kaifile.roc names and restore its downloads
      uses: lukewilliamboswell/roc-automation/actions/setup-kai@6c796f299012707d2e9bad23fd6449ed93f1f475 # reviewed main
      with:
        nix: 'false'
        cache: 'true'

    # Download the Roc compiler Kai pins for compiling Kaifile.roc, and compile
    # it, before the workflow's next step puts the latest nightly on PATH as
    # `roc` for the package and examples.
    - name: Validate configuration and provision the Kai compiler
      shell: bash
      run: |
        start=$SECONDS
        kai check
        elapsed=$((SECONDS - start))
        echo "Kai configuration bootstrap and validation: $elapsed seconds"
        printf '\n### Kai configuration bootstrap\n\n%s seconds, including compiler provisioning, verification and configuration check.\n' "$elapsed" >> "$GITHUB_STEP_SUMMARY"
